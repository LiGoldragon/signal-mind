[package]
name         = "signal-mind"
version      = "0.8.0"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/signal-mind"
description  = "Signal contract — `mind` CLI ↔ mind channel: typed records for work graph, mind graph, and channel choreography."
publish      = false

[lib]
name = "signal_mind"
path = "src/lib.rs"

[features]
default = ["nota-text"]
nota-text = ["signal-frame/nota-text"]

[dependencies]
signal-frame        = { git = "https://github.com/LiGoldragon/signal-frame.git", branch = "main" }
signal-persona      = { git = "https://github.com/LiGoldragon/signal-persona.git", rev = "e6fbc977cdf6a19b9ee31b41d235e1808091dc88", features = ["nota-text"] }
signal-domain       = { git = "https://github.com/LiGoldragon/signal-domain.git", rev = "801e1c5bcc824c9760e246205826e3c8e962d005", features = ["nota-text"] }
nota = { package = "nota", git = "https://github.com/LiGoldragon/nota.git", branch = "main" }
rkyv                = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
thiserror           = "2"

[patch."https://github.com/LiGoldragon/nota-next.git"]
nota = { git = "https://github.com/LiGoldragon/nota.git", branch = "main" }

[patch."https://github.com/LiGoldragon/schema-next.git"]
schema = { package = "schema", git = "https://github.com/LiGoldragon/schema.git", rev = "4a8aaf1de3aaf476577d5b4e93691ef47c135d1a" }
schema-cc = { package = "schema-cc", git = "https://github.com/LiGoldragon/schema.git", rev = "4a8aaf1de3aaf476577d5b4e93691ef47c135d1a" }

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
