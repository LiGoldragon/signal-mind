[package]
name         = "signal-mind"
version      = "0.8.0"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/signal-mind"
description  = "Signal contract — `mind` CLI ↔ mind channel: typed records for work graph, mind graph, and channel choreography."
publish      = false

[lib]
name = "signal_mind"
path = "src/lib.rs"

[features]
default = ["dotos-text"]
dotos-text = ["signal-frame/dotos-text"]

[dependencies]
signal-frame = { git = "https://github.com/LiGoldragon/signal-frame.git", rev = "ca72b2d1151f5b3df536295b2ba68f039536ec19" }
signal-persona = { git = "https://github.com/LiGoldragon/signal-persona.git", rev = "51ee97b12fef5dfd8c4bbf876dc3e4f0ee14df5a", features = ["dotos-text"] }
signal-domain = { git = "https://github.com/LiGoldragon/signal-domain.git", rev = "1890f33174f3637b2d605b9c79e584e127580d13", features = ["dotos-text"] }
dotos = { package = "dotos", git = "https://github.com/LiGoldragon/dotos.git", rev = "80c7b17f7ad3" }
rkyv                = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
thiserror           = "2"

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
